<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneBox</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#0066FF',
              hover: '#0052CC',
              subtle: 'rgba(0, 102, 255, 0.12)'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Style application de bureau native */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, [contenteditable="true"] {
      user-select: text;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(140, 140, 140, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(140, 140, 140, 0.4);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-white text-zinc-900 dark:bg-[#111215] dark:text-[#E4E5E8] overflow-hidden">

  <!-- Barre supérieure de fenêtre (Window Titlebar) -->
  <header class="h-11 border-b border-zinc-200 dark:border-[#222328] bg-zinc-50 dark:bg-[#16171B] flex items-center justify-between px-3.5 select-none shrink-0 z-30">
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2">
        <img src="/assets/logo.jpg" alt="Logo" class="w-5 h-5 rounded object-cover shadow-sm">
        <span class="font-semibold text-xs tracking-tight">OneBox</span>
      </div>
      <div class="h-3 w-[1px] bg-zinc-300 dark:bg-zinc-700"></div>
      <span class="text-[11px] text-zinc-600 dark:text-zinc-300 font-medium flex items-center space-x-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span>Stockage local</span>
      </span>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="toggleTheme()" class="p-1.5 rounded text-zinc-700 dark:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-[#25262B] transition-colors" title="Basculer le thème">
        <svg id="themeIconSun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg id="themeIconMoon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>
      <button onclick="openSettingsModal()" class="p-1.5 rounded text-zinc-700 dark:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-[#25262B] transition-colors" title="Paramètres">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </div>
  </header>

  <!-- Application Principale (Disposition 3 colonnes style logiciel classique) -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Colonne 1 : Navigation latérale -->
    <nav class="w-56 border-r border-zinc-200 dark:border-[#222328] bg-zinc-50/70 dark:bg-[#141519] flex flex-col justify-between shrink-0 p-2.5 select-none">
      <div class="space-y-4">
        
        <!-- Bouton Nouveau -->
        <button onclick="createNewNote()" class="w-full flex items-center justify-center space-x-2 py-2 px-3 rounded-lg bg-brand hover:bg-brand-hover text-white text-xs font-medium transition-all shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Nouvelle note</span>
        </button>

        <!-- Menus de contenu -->
        <div class="space-y-0.5">
          <button onclick="setFilter('inbox')" id="nav-inbox" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium bg-zinc-200 dark:bg-[#22242B] text-zinc-900 dark:text-white">
            <div class="flex items-center space-x-2">
              <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
              <span>Tous les éléments</span>
            </div>
            <span id="count-inbox" class="text-[10px] text-zinc-600 dark:text-zinc-300 font-medium">0</span>
          </button>

          <button onclick="setFilter('notes')" id="nav-notes" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]">
            <div class="flex items-center space-x-2">
              <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <span>Notes</span>
            </div>
            <span id="count-notes" class="text-[10px] text-zinc-600 dark:text-zinc-300 font-medium">0</span>
          </button>

          <button onclick="setFilter('links')" id="nav-links" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]">
            <div class="flex items-center space-x-2">
              <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
              <span>Liens</span>
            </div>
            <span id="count-links" class="text-[10px] text-zinc-600 dark:text-zinc-300 font-medium">0</span>
          </button>

          <button onclick="setFilter('files')" id="nav-files" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]">
            <div class="flex items-center space-x-2">
              <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
              <span>Fichiers & Images</span>
            </div>
            <span id="count-files" class="text-[10px] text-zinc-600 dark:text-zinc-300 font-medium">0</span>
          </button>

          <button onclick="setFilter('favorites')" id="nav-favorites" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]">
            <div class="flex items-center space-x-2">
              <svg class="w-3.5 h-3.5 text-amber-500 fill-amber-500" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              <span>Favoris</span>
            </div>
            <span id="count-favs" class="text-[10px] text-zinc-600 dark:text-zinc-300 font-medium">0</span>
          </button>
        </div>

        <!-- Section Étiquettes -->
        <div class="pt-2 border-t border-zinc-200 dark:border-[#222328]">
          <div class="flex items-center justify-between px-2.5 mb-1.5">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Étiquettes</span>
            <button onclick="createTagPrompt()" class="text-xs text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200" title="Ajouter une étiquette">+</button>
          </div>
          <div id="tagsNavContainer" class="space-y-0.5 max-h-48 overflow-y-auto">
            <!-- Rendu des tags -->
          </div>
        </div>

      </div>

      <!-- Bas de colonne latérale -->
      <div class="pt-2 border-t border-zinc-200 dark:border-[#222328] space-y-0.5">
        <button onclick="setFilter('trash')" id="nav-trash" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-500 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]">
          <div class="flex items-center space-x-2">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            <span>Corbeille</span>
          </div>
          <span id="count-trash" class="text-[10px] text-zinc-600 dark:text-zinc-300 font-medium">0</span>
        </button>

        <button onclick="openExportModal()" class="w-full flex items-center space-x-2 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]">
          <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>Exporter / Sauvegarder</span>
        </button>
      </div>
    </nav>

    <!-- Colonne 2 : Liste des éléments -->
    <section class="w-72 border-r border-zinc-200 dark:border-[#222328] bg-white dark:bg-[#16171B] flex flex-col shrink-0 select-none">
      
      <!-- Barre de recherche -->
      <div class="p-2.5 border-b border-zinc-200 dark:border-[#222328] flex items-center space-x-2">
        <div class="relative flex-1">
          <svg class="w-3.5 h-3.5 text-zinc-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Rechercher... (Ctrl+K)" 
            class="w-full pl-8 pr-3 py-1.5 rounded-md text-xs bg-zinc-100 dark:bg-[#1E2026] border border-transparent focus:border-brand dark:focus:border-brand focus:outline-none placeholder-zinc-400"
          >
        </div>
        
        <!-- Bouton d'ajout rapide (Lien / Fichier) -->
        <div class="relative">
          <button onclick="toggleQuickMenu()" class="p-1.5 rounded border border-zinc-200 dark:border-[#2A2C34] hover:bg-zinc-100 dark:hover:bg-[#202228] text-zinc-600 dark:text-zinc-300" title="Ajouter un lien ou un fichier">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
          
          <div id="quickMenu" class="hidden absolute right-0 mt-1 w-44 rounded-lg bg-white dark:bg-[#1F2128] border border-zinc-200 dark:border-[#2C2E38] shadow-lg py-1 text-xs z-40">
            <button onclick="openAddLinkPrompt()" class="w-full px-3 py-1.5 text-left hover:bg-zinc-100 dark:hover:bg-[#282A33] flex items-center space-x-2">
              <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
              <span>Enregistrer un lien</span>
            </button>
            <label class="w-full px-3 py-1.5 text-left hover:bg-zinc-100 dark:hover:bg-[#282A33] flex items-center space-x-2 cursor-pointer">
              <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              <span>Importer un fichier...</span>
              <input type="file" onchange="uploadDirectFile(event)" class="hidden">
            </label>
          </div>
        </div>
      </div>

      <!-- Liste scrollable -->
      <div id="itemsList" class="flex-1 overflow-y-auto divide-y divide-zinc-100 dark:divide-[#1D1F25]">
        <!-- Rendu dynamique des éléments -->
      </div>
    </section>

    <!-- Colonne 3 : Espace de travail / Éditeur / Visualiseur central -->
    <main class="flex-1 flex flex-col bg-white dark:bg-[#111215] overflow-hidden" id="workspaceContainer">
      <!-- État vide si rien n'est sélectionné -->
      <div id="emptyWorkspace" class="flex-1 flex flex-col items-center justify-center text-zinc-400 p-8 text-center">
        <svg class="w-12 h-12 stroke-[1.2] text-zinc-300 dark:text-zinc-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">Aucun élément sélectionné</p>
        <p class="text-xs text-zinc-400 dark:text-zinc-500 mt-1 max-w-xs">Sélectionnez une note dans la liste ou appuyez sur <kbd class="px-1 py-0.5 rounded bg-zinc-200 dark:bg-zinc-800 text-[10px]">Ctrl+N</kbd> pour en créer une.</p>
      </div>

      <!-- Contenu actif (affiché dès qu'un élément est sélectionné) -->
      <div id="activeWorkspace" class="flex-1 flex flex-col hidden overflow-hidden">
        
        <!-- Barre d'outils de l'élément -->
        <div class="h-11 border-b border-zinc-200 dark:border-[#222328] px-5 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-2">
            <span id="activeTypeBadge" class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-zinc-100 dark:bg-[#202228] text-zinc-500">Note</span>
            <span id="activeDateLabel" class="text-xs text-zinc-400 font-mono">Modifié à l'instant</span>
          </div>

          <div class="flex items-center space-x-1">
            <button onclick="toggleActiveFavorite()" id="activeFavBtn" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-[#202228] text-zinc-400 hover:text-amber-500" title="Favori">
              <svg id="activeFavIcon" class="w-4 h-4 fill-none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
            </button>
            <button onclick="exportCurrentItem()" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-[#202228] text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200" title="Exporter cet élément">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </button>
            <button onclick="deleteCurrentItem()" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-[#202228] text-zinc-400 hover:text-rose-500" title="Mettre en corbeille">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </div>

        <!-- Corps de l'élément (Édition directe) -->
        <div class="flex-1 overflow-y-auto p-8 max-w-3xl mx-auto w-full space-y-4">
          
          <!-- Titre (éditable directement sans modal) -->
          <input 
            id="activeTitleInput" 
            type="text" 
            placeholder="Sans titre" 
            class="w-full text-2xl font-bold bg-transparent border-0 border-b border-transparent focus:border-zinc-200 dark:focus:border-[#2A2C34] focus:outline-none px-0 py-1 tracking-tight placeholder-zinc-300 dark:placeholder-zinc-700"
            oninput="triggerAutoSave()"
          >

          <!-- Zone Tags associés -->
          <div class="flex items-center space-x-1.5 flex-wrap" id="activeTagsContainer">
            <!-- Badges tags + bouton ajouter -->
          </div>

          <!-- Zone Contenu selon Type -->
          <div id="activeBodyArea" class="pt-2">
            <!-- Rendu dynamique (Textarea note, carte lien, aperçu image, fichier) -->
          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- Modal Paramètres & Export -->
  <div id="settingsModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-[#1A1B20] border border-zinc-200 dark:border-[#2A2C34] rounded-xl w-full max-w-md shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-200 dark:border-[#2A2C34]">
        <h3 class="font-semibold text-sm">Paramètres de OneBox</h3>
        <button onclick="closeSettingsModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-zinc-400 font-medium mb-1">Dossier de stockage local</label>
          <input id="settingStoragePath" type="text" readonly class="w-full px-2.5 py-1.5 rounded bg-zinc-100 dark:bg-[#141518] border border-zinc-200 dark:border-[#2A2C34] font-mono text-[11px] text-zinc-500">
        </div>

        <div class="pt-2 border-t border-zinc-200 dark:border-[#2A2C34] space-y-2">
          <label class="block text-zinc-400 font-medium">Sauvegardes et données</label>
          <div class="flex space-x-2">
            <button onclick="downloadBackup()" class="flex-1 py-1.5 px-3 rounded bg-zinc-100 dark:bg-[#24262E] hover:bg-zinc-200 dark:hover:bg-[#2C2E38] font-medium border border-zinc-200 dark:border-[#30323C] transition-colors">
              Exporter archive (ZIP)
            </button>
            <label class="flex-1 py-1.5 px-3 rounded bg-zinc-100 dark:bg-[#24262E] hover:bg-zinc-200 dark:hover:bg-[#2C2E38] font-medium border border-zinc-200 dark:border-[#30323C] text-center cursor-pointer transition-colors">
              <span>Restaurer (JSON)</span>
              <input type="file" accept=".json" onchange="restoreBackupFile(event)" class="hidden">
            </label>
          </div>
        </div>

        <div class="pt-3 border-t border-zinc-200 dark:border-[#2A2C34] text-[11px] text-zinc-500 space-y-1">
          <p>Application locale autonome • Licence Apache 2.0</p>
          <p>Toutes vos données restent sur votre ordinateur.</p>
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="closeSettingsModal()" class="px-3 py-1.5 rounded text-xs font-medium bg-brand text-white">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast discrète -->
  <div id="toast" class="fixed bottom-4 right-4 px-3.5 py-2 rounded-lg bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-200 z-50">
    <span id="toastText">Enregistré</span>
  </div>

  <script>
    let activeFilter = 'inbox';
    let activeTagId = null;
    let searchQuery = '';
    let items = [];
    let tags = [];
    let activeItem = null;
    let saveTimeout = null;

    // Gestion du Thème (Dark / Light)
    function initTheme() {
      const isDark = localStorage.getItem('onebox_theme') !== 'light';
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('themeIconSun').classList.toggle('hidden', !isDark);
      document.getElementById('themeIconMoon').classList.toggle('hidden', isDark);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('onebox_theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIconSun').classList.toggle('hidden', !isDark);
      document.getElementById('themeIconMoon').classList.toggle('hidden', isDark);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastText').innerText = msg;
      t.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2200);
    }

    // Chargement des données
    async function loadTags() {
      try {
        const res = await fetch('/api/tags');
        const data = await res.json();
        tags = data.tags || [];
        renderTagsNav();
      } catch (err) {
        console.error('Erreur chargement tags:', err);
      }
    }

    function renderTagsNav() {
      const container = document.getElementById('tagsNavContainer');
      if (tags.length === 0) {
        container.innerHTML = '<span class="text-[11px] text-zinc-400 px-2.5 italic">Aucune étiquette</span>';
        return;
      }
      container.innerHTML = tags.map(tag => `
        <div onclick="filterByTag('${tag.id}')" class="group flex items-center justify-between px-2.5 py-1 rounded-md text-xs cursor-pointer ${activeTagId === tag.id ? 'bg-zinc-200 dark:bg-[#22242B] font-semibold text-zinc-900 dark:text-white' : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/50 dark:hover:bg-[#1E2026]'}">
          <div class="flex items-center space-x-1.5 truncate">
            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${tag.color || '#0066FF'}"></span>
            <span class="truncate">${escapeHtml(tag.name)}</span>
          </div>
          <button onclick="event.stopPropagation(); deleteTag('${tag.id}')" class="opacity-0 group-hover:opacity-100 hover:text-rose-500 text-zinc-400 text-xs px-1">✕</button>
        </div>
      `).join('');
    }

    async function loadItems() {
      try {
        const params = new URLSearchParams();
        if (searchQuery) params.append('q', searchQuery);
        if (activeFilter === 'trash') params.append('trash', 'true');
        else if (activeFilter === 'favorites') params.append('favorites', 'true');
        else if (activeFilter === 'notes') params.append('type', 'note');
        else if (activeFilter === 'links') params.append('type', 'link');
        else if (activeFilter === 'files') {
          // Affiche fichiers ou images
          params.append('type', 'file');
        }

        if (activeTagId) params.append('tagId', activeTagId);

        const res = await fetch('/api/items?' + params.toString());
        const data = await res.json();
        items = data.items || [];
        renderItemsList();
        updateCounts();

        // Si l'élément actif n'est plus dans la liste, désélectionner
        if (activeItem && !items.some(i => i.id === activeItem.id)) {
          if (items.length > 0) {
            selectItem(items[0].id);
          } else {
            closeWorkspace();
          }
        }
      } catch (err) {
        console.error('Erreur chargement items:', err);
      }
    }

    function renderItemsList() {
      const container = document.getElementById('itemsList');
      if (items.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-zinc-400 text-xs">
            Aucun élément trouvé
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => {
        const isSelected = activeItem && activeItem.id === item.id;
        const isFav = item.favorite === 1;
        const dateStr = formatRelativeDate(item.updated_at || item.created_at);

        return `
          <div onclick="selectItem('${item.id}')" class="p-3 cursor-pointer transition-colors ${isSelected ? 'bg-zinc-100 dark:bg-[#1E2026] border-l-2 border-brand' : 'hover:bg-zinc-50 dark:hover:bg-[#18191E]'}">
            <div class="flex items-start justify-between">
              <h4 class="text-xs font-semibold truncate flex-1 ${isSelected ? 'text-zinc-900 dark:text-white' : 'text-zinc-700 dark:text-zinc-300'}">
                ${escapeHtml(item.title || 'Sans titre')}
              </h4>
              ${isFav ? '<span class="text-amber-500 text-xs ml-1 shrink-0">★</span>' : ''}
            </div>
            
            <p class="text-[11px] text-zinc-400 dark:text-zinc-500 line-clamp-2 mt-1 leading-snug">
              ${escapeHtml(item.snippet || (item.note ? item.note.body_text : (item.description || '')))}
            </p>

            <div class="mt-2 flex items-center justify-between text-[10px] text-zinc-400">
              <span>${dateStr}</span>
              <span class="uppercase text-[9px] font-mono px-1 py-0.2 rounded bg-zinc-200/60 dark:bg-zinc-800">${item.type}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function selectItem(id) {
      try {
        const res = await fetch(`/api/items/${id}`);
        const item = await res.json();
        activeItem = item;

        document.getElementById('emptyWorkspace').classList.add('hidden');
        document.getElementById('activeWorkspace').classList.remove('hidden');

        // Métadonnées
        document.getElementById('activeTypeBadge').innerText = item.type;
        document.getElementById('activeDateLabel').innerText = new Date(item.updated_at || item.created_at).toLocaleString();
        document.getElementById('activeTitleInput').value = item.title || '';

        // Bouton favori
        const favIcon = document.getElementById('activeFavIcon');
        const favBtn = document.getElementById('activeFavBtn');
        if (item.favorite === 1) {
          favIcon.classList.remove('fill-none');
          favIcon.classList.add('fill-amber-500', 'text-amber-500');
        } else {
          favIcon.classList.remove('fill-amber-500', 'text-amber-500');
          favIcon.classList.add('fill-none');
        }

        // Tags
        renderActiveTags(item);

        // Contenu
        const bodyArea = document.getElementById('activeBodyArea');
        if (item.type === 'note') {
          bodyArea.innerHTML = `
            <textarea 
              id="activeNoteBody" 
              rows="16" 
              placeholder="Écrivez votre texte ou Markdown ici..." 
              class="w-full bg-transparent text-sm font-sans leading-relaxed border-0 focus:outline-none resize-none placeholder-zinc-400 dark:placeholder-zinc-600"
              oninput="triggerAutoSave()"
            >${escapeHtml(item.note ? item.note.body_text : '')}</textarea>
          `;
        } else if (item.type === 'link') {
          bodyArea.innerHTML = `
            <div class="p-4 rounded-lg border border-zinc-200 dark:border-[#262830] bg-zinc-50 dark:bg-[#16171B] space-y-3">
              <div>
                <span class="text-[10px] font-semibold text-zinc-400 uppercase">Adresse URL</span>
                <p class="text-xs font-mono text-brand truncate mt-0.5">${escapeHtml(item.link ? item.link.url : '')}</p>
              </div>
              <div>
                <a href="${escapeHtml(item.link ? item.link.url : '#')}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded bg-brand text-white text-xs font-medium hover:bg-brand-hover transition-colors">
                  <span>Ouvrir dans le navigateur</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
              </div>
              ${item.description ? `
                <div class="pt-2 border-t border-zinc-200 dark:border-[#262830]">
                  <p class="text-xs text-zinc-500">${escapeHtml(item.description)}</p>
                </div>
              ` : ''}
            </div>
          `;
        } else if (item.type === 'image') {
          bodyArea.innerHTML = `
            <div class="space-y-3">
              <div class="rounded-lg overflow-hidden border border-zinc-200 dark:border-[#262830] bg-black/30 flex items-center justify-center p-2">
                <img src="/api/attachments/${item.id}" alt="${escapeHtml(item.title)}" class="max-h-96 object-contain rounded">
              </div>
              <p class="text-xs text-zinc-400 font-mono">${item.file ? escapeHtml(item.file.display_name) : ''}</p>
            </div>
          `;
        } else if (item.type === 'file') {
          bodyArea.innerHTML = `
            <div class="p-5 rounded-lg border border-zinc-200 dark:border-[#262830] bg-zinc-50 dark:bg-[#16171B] space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <h4 class="text-sm font-semibold">${escapeHtml(item.file ? item.file.display_name : item.title)}</h4>
                  <p class="text-xs text-zinc-400 mt-0.5">${item.file ? Math.round(item.file.size_bytes / 1024) + ' Ko' : ''} • ${item.file ? item.file.mime_type : ''}</p>
                </div>
                <a href="/api/attachments/${item.id}" download="${escapeHtml(item.file ? item.file.display_name : 'document')}" class="px-3 py-1.5 rounded text-xs font-medium bg-zinc-200 dark:bg-[#252730] hover:bg-zinc-300 dark:hover:bg-[#2E303C] transition-colors">
                  Télécharger
                </a>
              </div>
              <p class="text-[10px] font-mono text-zinc-400 break-all">SHA-256 : ${item.file ? item.file.checksum : ''}</p>
            </div>
          `;
        }

        renderItemsList();
      } catch (err) {
        console.error('Erreur sélection item:', err);
      }
    }

    function renderActiveTags(item) {
      const container = document.getElementById('activeTagsContainer');
      const itemTagIds = new Set((item.tags || []).map(t => t.id));

      const tagsHtml = (item.tags || []).map(t => `
        <span class="inline-flex items-center space-x-1 text-[11px] px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-[#202228] text-zinc-600 dark:text-zinc-300">
          <span>#${escapeHtml(t.name)}</span>
          <button onclick="removeTagFromActive('${t.id}')" class="text-zinc-400 hover:text-rose-500 ml-0.5">✕</button>
        </span>
      `).join('');

      container.innerHTML = `
        ${tagsHtml}
        <button onclick="promptAddTagToActive()" class="text-[11px] text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 px-1.5 py-0.5 rounded border border-dashed border-zinc-300 dark:border-zinc-700">
          + Étiquette
        </button>
      `;
    }

    function closeWorkspace() {
      activeItem = null;
      document.getElementById('activeWorkspace').classList.add('hidden');
      document.getElementById('emptyWorkspace').classList.remove('hidden');
    }

    // Sauvegarde automatique en direct
    function triggerAutoSave() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveActiveItemDirectly, 400);
    }

    async function saveActiveItemDirectly() {
      if (!activeItem) return;
      const title = document.getElementById('activeTitleInput').value.trim() || 'Sans titre';
      let noteBody = undefined;
      const noteEl = document.getElementById('activeNoteBody');
      if (noteEl) noteBody = noteEl.value;

      try {
        const res = await fetch(`/api/items/${activeItem.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, noteBody })
        });
        if (res.ok) {
          activeItem.title = title;
          if (noteBody !== undefined && activeItem.note) {
            activeItem.note.body_text = noteBody;
          }
          renderItemsList();
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Créer une nouvelle note immédiatement (style Apple Notes / Obsidian)
    async function createNewNote() {
      try {
        const res = await fetch('/api/items/note', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Nouvelle note', body_text: '' })
        });
        const note = await res.json();
        await loadItems();
        selectItem(note.id);
        setTimeout(() => {
          const titleInput = document.getElementById('activeTitleInput');
          if (titleInput) {
            titleInput.focus();
            titleInput.select();
          }
        }, 50);
      } catch (err) {
        console.error(err);
      }
    }

    async function openAddLinkPrompt() {
      toggleQuickMenu();
      const url = prompt('Collez l\'adresse URL :');
      if (!url) return;
      try {
        const res = await fetch('/api/items/link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (res.ok) {
          const item = await res.json();
          await loadItems();
          selectItem(item.id);
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function uploadDirectFile(event) {
      toggleQuickMenu();
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const fd = new FormData();
      fd.append('file', file);

      try {
        const res = await fetch('/api/items/file', {
          method: 'POST',
          body: fd
        });
        if (res.ok) {
          const item = await res.json();
          await loadItems();
          selectItem(item.id);
        }
      } catch (err) {
        console.error(err);
      } finally {
        event.target.value = '';
      }
    }

    function toggleQuickMenu() {
      document.getElementById('quickMenu').classList.toggle('hidden');
    }

    async function toggleActiveFavorite() {
      if (!activeItem) return;
      const newStatus = activeItem.favorite === 1 ? false : true;
      try {
        await fetch(`/api/items/${activeItem.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ favorite: newStatus })
        });
        activeItem.favorite = newStatus ? 1 : 0;
        selectItem(activeItem.id);
        loadItems();
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteCurrentItem() {
      if (!activeItem) return;
      if (activeFilter === 'trash') {
        if (!confirm('Supprimer définitivement cet élément ?')) return;
        await fetch(`/api/items/${activeItem.id}`, { method: 'DELETE' });
      } else {
        await fetch(`/api/items/${activeItem.id}/trash`, { method: 'POST' });
        showToast('Déplacé dans la corbeille');
      }
      closeWorkspace();
      loadItems();
    }

    async function exportCurrentItem() {
      if (!activeItem) return;
      if (activeItem.type === 'note' && activeItem.note) {
        const blob = new Blob([activeItem.note.body_text], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${activeItem.title || 'note'}.md`;
        a.click();
      } else if (activeItem.file) {
        window.open(`/api/attachments/${activeItem.id}`, '_blank');
      } else if (activeItem.link) {
        navigator.clipboard.writeText(activeItem.link.url);
        showToast('Lien copié dans le presse-papier');
      }
    }

    // Gestion des tags
    async function createTagPrompt() {
      const name = prompt('Nom de la nouvelle étiquette :');
      if (!name || !name.trim()) return;
      try {
        await fetch('/api/tags', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name.trim() })
        });
        loadTags();
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteTag(id) {
      if (!confirm('Supprimer cette étiquette ?')) return;
      await fetch(`/api/tags/${id}`, { method: 'DELETE' });
      if (activeTagId === id) activeTagId = null;
      loadTags();
      loadItems();
    }

    function filterByTag(id) {
      activeTagId = activeTagId === id ? null : id;
      renderTagsNav();
      loadItems();
    }

    async function promptAddTagToActive() {
      if (!activeItem || tags.length === 0) {
        alert('Créez d\'abord une étiquette dans le menu de gauche.');
        return;
      }
      const tagNames = tags.map(t => t.name).join('\n- ');
      const chosen = prompt(`Entrez le nom de l'étiquette à ajouter :\n- ${tagNames}`);
      if (!chosen) return;

      const tag = tags.find(t => t.name.toLowerCase() === chosen.trim().toLowerCase());
      if (!tag) {
        alert('Étiquette non trouvée.');
        return;
      }

      const currentTagIds = (activeItem.tags || []).map(t => t.id);
      if (!currentTagIds.includes(tag.id)) {
        currentTagIds.push(tag.id);
        await fetch(`/api/items/${activeItem.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tagIds: currentTagIds })
        });
        selectItem(activeItem.id);
        loadItems();
      }
    }

    async function removeTagFromActive(tagId) {
      if (!activeItem) return;
      const currentTagIds = (activeItem.tags || []).map(t => t.id).filter(id => id !== tagId);
      await fetch(`/api/items/${activeItem.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tagIds: currentTagIds })
      });
      selectItem(activeItem.id);
      loadItems();
    }

    // Filtres généraux
    function setFilter(filter) {
      activeFilter = filter;
      activeTagId = null;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200/60 dark:hover:bg-[#1E2026]';
      });
      const activeBtn = document.getElementById(`nav-${filter}`);
      if (activeBtn) {
        activeBtn.className = 'nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium bg-zinc-200 dark:bg-[#22242B] text-zinc-900 dark:text-white';
      }
      renderTagsNav();
      loadItems();
    }

    async function updateCounts() {
      try {
        const res = await fetch('/api/items?trash=false');
        const data = await res.json();
        const all = data.items || [];
        document.getElementById('count-inbox').innerText = all.length;
        document.getElementById('count-notes').innerText = all.filter(i => i.type === 'note').length;
        document.getElementById('count-links').innerText = all.filter(i => i.type === 'link').length;
        document.getElementById('count-files').innerText = all.filter(i => i.type === 'file' || i.type === 'image').length;
        document.getElementById('count-favs').innerText = all.filter(i => i.favorite === 1).length;

        const resTrash = await fetch('/api/items?trash=true');
        const dataTrash = await resTrash.json();
        document.getElementById('count-trash').innerText = dataTrash.count || 0;
      } catch {}
    }

    function openSettingsModal() {
      fetch('/api/settings').then(r => r.json()).then(data => {
        document.getElementById('settingStoragePath').value = data.storagePath || '';
        document.getElementById('settingsModal').classList.remove('hidden');
      });
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function downloadBackup() {
      window.location.href = '/api/export/zip';
    }

    async function restoreBackupFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        const res = await fetch('/api/restore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(json)
        });
        const data = await res.json();
        if (data.success) {
          showToast(`${data.importedItemsCount} éléments restaurés`);
          closeSettingsModal();
          loadTags();
          loadItems();
        }
      } catch (err) {
        alert('Erreur lors de la lecture du fichier : ' + err.message);
      }
    }

    // Raccourcis clavier (Ctrl+N, Ctrl+K)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
        e.preventDefault();
        createNewNote();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    let searchTimeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = e.target.value.trim();
        loadItems();
      }, 150);
    });

    // Date relative lisible
    function formatRelativeDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const now = new Date();
      const diffMs = now.getTime() - d.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'À l\'instant';
      if (diffMin < 60) return `Il y a ${diffMin} min`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `Il y a ${diffHours} h`;
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Lancement
    initTheme();
    loadTags();
    loadItems().then(() => {
      if (items.length > 0) selectItem(items[0].id);
    });
  </script>
</body>
</html>
