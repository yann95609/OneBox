name: ONEBOX CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Tests unitaires et d'acceptation (AC-01 à AC-10)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exécution des tests d'acceptation
        run: npm test

